{%- assign buildAt = site.buildAt -%}
<head>
  <title>{{ page.title }}|{{ site.title }}</title>
  <meta charset="utf-8" />
  <meta http-equiv="content-language" content="zh-CN" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="supported-color-schemes" content="light dark">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="applicable-device" content="pc,mobile">
  <meta name="author" content="{{ site.author }}" />
  {%- if page.categories %}
  <meta name="description" content="{{ page.title }}"/>
  <meta name="keywords" content="{{ site.author }}{% for category in page.categories %},{{ category }}{% endfor %}"/>
  {% else %}
  <meta name="description" content="{{ site.description }}"/>
  <meta name="keywords" content="{{ site.keywords }}"/>
  {% endif -%}
  <link rel="icon" href="{{site.baseurl}}/static/img/favicon.ico" />
  <link rel="preload" as="image" href="{{site.baseurl}}/static/img/logo.webp" fetchpriority="high" />
  <link rel="apple-touch-icon" href="{{site.baseurl}}/static/img/logo.jpg" />
  <link rel="stylesheet" href="{{site.baseurl}}/static/css/common.css?t={{buildAt}}">
  <link rel="stylesheet" href="{{site.baseurl}}/static/css/theme-dark.css?t={{buildAt}}">
  {%- if page.layout == "mypost" %}
  <link rel="stylesheet" href="{{site.baseurl}}/static/css/post.css?t={{buildAt}}">
  <link rel="stylesheet" href="{{site.baseurl}}/static/css/code-dark.css?t={{buildAt}}">
  <link rel="stylesheet" href="{{site.baseurl}}/static/css/code-light.css?t={{buildAt}}">
  {%- endif %}
  {%- if page.layout == "page" %}
  <link rel="stylesheet" href="{{site.baseurl}}/static/css/page.css?t={{buildAt}}">
  {%- endif %}
  {%- if page.search -%}
  <link rel="prefetch" href="{{site.baseurl}}/static/xml/search.xml?t={{ buildAt }}">
  <link rel="prefetch" href="{{site.baseurl}}/static/js/search.js?t={{ buildAt }}">
  {%- endif -%}
  <script>
    function readThemePreference() {
      try {
        return localStorage.getItem('darkTheme')
      } catch (error) {
        return null
      }
    }

    const storedThemePreference = readThemePreference()

    window.blog = {
      baseurl:"{{site.baseurl}}",
      buildAt:"{{buildAt}}",
      darkTheme: false,
      getStoredTheme: function () {
        return storedThemePreference
      },
      setStoredTheme: function (dark) {
        storedThemePreference = dark ? 'true' : 'false'
        try {
          localStorage.setItem('darkTheme', storedThemePreference)
        } catch (error) {
          // 隐私模式或存储不可用时，仅本次会话内生效
        }
      },
      setDarkTheme: function (dark) {
        this.darkTheme = Boolean(dark);
        document.documentElement.className = this.darkTheme ? 'dark': '';
        document.querySelector('meta[name=theme-color]').setAttribute('content', this.darkTheme ? '#2D2E32': '#FFFFFF');
      }
    }
    if (blog.getStoredTheme() !== null) {
      blog.setDarkTheme(blog.getStoredTheme() === 'true'); // 记忆值，持久化保存
    } else {
      blog.setDarkTheme(window.matchMedia('(prefers-color-scheme: dark)').matches); // 跟随系统
    }
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const mediaListener = function (ev) {
      if (blog.getStoredTheme() === null) {
        blog.setDarkTheme(ev.currentTarget.matches);
      }
    };
    media.addEventListener('change', mediaListener)
  </script>
</head>
